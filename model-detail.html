<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="ModelZoo Duck Lab 模型规格、OM 构建与算力引擎详情。">
    <meta name="theme-color" content="#ffd438">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ModelZoo Duck Lab">
    <meta property="og:title" content="模型档案｜ModelZoo Duck Lab">
    <meta property="og:description" content="查看模型参数、下载文件、OM 构建与对应算力引擎。">
    <meta property="og:image" content="https://gitbubble.github.io/hisilicon-developer-portal-mirror/assets/images/modelzoo-duck-keeper.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="assets/images/modelzoo-duck-keeper.png" type="image/png">
    <title>模型详情 - ModelZoo镜像站</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-title-key="page.detailTitle">
    <div class="header">
        <div class="header-left">
            <a href="index.html" class="site-brand" data-i18n-aria-label="header.brandAria">
                <div class="brand-badge" aria-hidden="true"><img class="brand-duck" src="assets/images/modelzoo-duck-keeper.png" alt=""></div>
                <div class="brand-copy">
                    <span class="brand-subtitle" id="headerDateText"></span>
                    <strong class="brand-title" data-i18n="header.brandTitle">ModelZoo镜像站</strong>
                </div>
            </a>
            <div class="header-nav">
                <a href="index.html" class="nav-item active" data-i18n="header.navModelZoo">ModelZoo</a>
            </div>
            <div class="daily-quote" aria-live="polite">
                <p class="quote-text" id="dailyQuoteText">技术的价值，在于让复杂的事情变得可控。</p>
                <span class="quote-author" id="dailyQuoteAuthor">- 随机一言</span>
            </div>
            <div class="language-switcher" data-i18n-aria-label="header.languageSwitcher">
                <button type="button" class="language-btn" data-lang-option="zh">中</button>
                <button type="button" class="language-btn" data-lang-option="en">EN</button>
            </div>
        </div>
    </div>

    <div class="duck-ticker" aria-hidden="true">
        <div class="duck-ticker-track">
            <div class="duck-ticker-set">
                <span data-i18n="home.tickerModels">MODEL ZOO · 模型列队中</span><b>//</b>
                <span data-i18n="home.tickerOm">OM ENGINE · 引擎已标注</span><b>//</b>
                <span data-i18n="home.tickerOpen">OPEN MIRROR · 开发者友好</span><b>//</b>
            </div>
            <div class="duck-ticker-set">
                <span data-i18n="home.tickerModels">MODEL ZOO · 模型列队中</span><b>//</b>
                <span data-i18n="home.tickerOm">OM ENGINE · 引擎已标注</span><b>//</b>
                <span data-i18n="home.tickerOpen">OPEN MIRROR · 开发者友好</span><b>//</b>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="detail-container">
            <span class="detail-lab-kicker" data-i18n="detail.labKicker">DUCK LAB / MODEL SPECIMEN</span>
            <a href="index.html" class="back-btn" data-i18n="detail.backToMarket">← 返回模型市场</a>

            <header class="detail-header">
                <div id="modelImage" class="detail-hero-image" aria-hidden="true"></div>
                <div class="detail-header-main">
                    <div class="detail-title-row">
                        <h1 id="modelName">模型名称</h1>
                        <span id="modelBadge" class="detail-badge" style="display: none;"></span>
                    </div>
                    <div id="modelTags" class="detail-tags" data-i18n-aria-label="detail.modelTagsAria" aria-label="模型标签"></div>
                </div>
                <span class="detail-duck-seal" aria-hidden="true"><img src="assets/images/modelzoo-duck-keeper.png" alt=""></span>
            </header>

            <div id="betaNote" class="detail-note" style="display: none;"></div>

            <div class="action-buttons" role="group" data-i18n-aria-label="detail.actionsAria" aria-label="模型操作" hidden>
                <a id="quickStartLink" class="btn btn-primary btn-quick-start" data-i18n="detail.quickStart">快速开始</a>
                <a id="repoActionLink" class="btn btn-secondary" href="#" target="_blank" rel="noreferrer" data-i18n="detail.openRepo">打开 HF 镜像仓库</a>
                <button id="shareLinkButton" class="btn btn-secondary" type="button" data-i18n="detail.shareLink">分享链接</button>
            </div>

            <div class="detail-content">
                <div class="detail-section">
                    <h2 id="basicInfoHeading" data-i18n="detail.basicInfo">基本信息</h2>
                    <div class="table-frame">
                        <table class="spec-table" aria-labelledby="basicInfoHeading">
                            <tbody id="basicInfoTable"></tbody>
                        </table>
                    </div>
                </div>

                <div id="detailParamsSection" class="detail-section">
                    <h2 id="detailParamsHeading" data-i18n="detail.modelParams">模型参数</h2>
                    <div class="table-frame">
                        <table class="spec-table spec-table-compact" aria-labelledby="detailParamsHeading">
                            <tbody id="detailParamsList"></tbody>
                        </table>
                    </div>
                </div>

                <div class="detail-section">
                    <h2 id="downloadListHeading" data-i18n="detail.downloadList">下载清单</h2>
                    <div id="downloadSections"></div>
                </div>

                <div id="originModelsSection" class="detail-section" style="display: none;">
                    <h2 id="originModelsHeading" data-i18n="detail.originModelLinks">原始模型链接</h2>
                    <div id="originModelsTable"></div>
                </div>

                <section id="readmeSection" class="detail-section" aria-labelledby="readmeQuickStartHeading" style="display: none;">
                    <h2 id="readmeQuickStartHeading" tabindex="-1" data-i18n="detail.readmeQuickStart">README / 快速开始</h2>
                    <div id="readmeLinks" class="readme-links"></div>
                    <div id="readmeSections"></div>
                </section>
            </div>
        </div>
    </div>

    <footer class="site-footer detail-footer">
        <span data-site-updated></span>
    </footer>

    <script src="assets/js/models.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/models-detail.js"></script>
</body>
</html>
